
name: Construir APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicación Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar herramientas Android
        uses: android-actions/setup-android@v4

      - name: Aceptar licencias e instalar SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar dependencias
        run: npm install

      - name: Preparar icono de la aplicación
        run: |
          mkdir -p assets
          cat > assets/icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#17243b"/>
                <stop offset="1" stop-color="#0a0f1a"/>
              </linearGradient>
              <linearGradient id="wallet" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#38bdf8"/>
                <stop offset="1" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
            <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
            <circle cx="512" cy="512" r="330" fill="#1d2b45"/>
            <rect x="220" y="300" width="584" height="424" rx="76" fill="url(#wallet)"/>
            <path d="M278 300v-44c0-36 29-65 65-65h374c36 0 65 29 65 65v44" fill="none" stroke="#a7f3d0" stroke-width="34" stroke-linecap="round"/>
            <path d="M220 390h584" stroke="#e0f2fe" stroke-opacity=".7" stroke-width="18"/>
            <rect x="578" y="450" width="226" height="150" rx="38" fill="#101522" stroke="#a5f3fc" stroke-width="14"/>
            <circle cx="646" cy="525" r="22" fill="#4ade80"/>
            <path d="M330 505l62 62 122-140" fill="none" stroke="#4ade80" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          SVG
          convert -background none assets/icon.svg -resize 1024x1024 assets/icon.png

      - name: Generar iconos Android
        run: npx capacitor-assets generate --android

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar aplicación
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-control-financiero-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
