name: Construir APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicación Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar herramientas Android
        uses: android-actions/setup-android@v4

      - name: Aceptar licencias e instalar SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar dependencias
        run: npm install

      - name: Preparar icono de la aplicación
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          cat > assets/icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#17243b"/>
                <stop offset="1" stop-color="#0a0f1a"/>
              </linearGradient>
              <linearGradient id="wallet" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#38bdf8"/>
                <stop offset="1" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
            <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
            <circle cx="512" cy="512" r="330" fill="#1d2b45"/>
            <rect x="220" y="300" width="584" height="424" rx="76" fill="url(#wallet)"/>
            <path d="M278 300v-44c0-36 29-65 65-65h374c36 0 65 29 65 65v44" fill="none" stroke="#a7f3d0" stroke-width="34" stroke-linecap="round"/>
            <path d="M220 390h584" stroke="#e0f2fe" stroke-opacity=".7" stroke-width="18"/>
            <rect x="578" y="450" width="226" height="150" rx="38" fill="#101522" stroke="#a5f3fc" stroke-width="14"/>
            <circle cx="646" cy="525" r="22" fill="#4ade80"/>
            <path d="M330 505l62 62 122-140" fill="none" stroke="#4ade80" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          SVG
          rsvg-convert -w 1024 -h 1024 -o assets/icon.png assets/icon.svg

      - name: Generar iconos Android
        run: npx capacitor-assets generate --android

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar aplicación
        run: npx cap sync android

      - name: Asignar número de compilación
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("android/app/build.gradle")
          text = p.read_text(encoding="utf-8")
          text, count = re.subn(r'versionCode\s+\d+', 'versionCode ' + os.environ["BUILD_NUMBER"], text, count=1)
          if count != 1:
              raise SystemExit("No se pudo asignar versionCode en android/app/build.gradle")
          p.write_text(text, encoding="utf-8")
          print("versionCode asignado:", os.environ["BUILD_NUMBER"])
          PY

      - name: Compilar APK de depuración y versión release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Firmar APK release si están configurados los secretos
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No se configuró llave de firma. Se publicará solo el APK debug para pruebas."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mcf-release.keystore"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/app-release-aligned.apk"
          SIGNED="android/app/build/outputs/apk/release/mi-control-financiero-release.apk"
          test -f "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/mcf-release.keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$ANDROID_KEY_PASSWORD" --out "$SIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$SIGNED"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Publicar APK debug para pruebas
        uses: actions/upload-artifact@v4
        with:
          name: mi-control-financiero-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar APK release firmado
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mi-control-financiero-apk-release-firmado
          path: android/app/build/outputs/apk/release/mi-control-financiero-release.apk
          if-no-files-found: error
